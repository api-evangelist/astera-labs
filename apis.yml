aid: astera-labs
name: Astera Labs
description: 'Astera Labs, Inc. (NASDAQ: ALAB) is a semiconductor company building
  purpose-built connectivity solutions for rack-scale AI and cloud infrastructure.
  Its Intelligent Connectivity Platform spans the Aries PCIe/CXL Smart DSP Retimers,
  Smart Cable Modules and Smart Gearboxes, the Taurus Ethernet Smart Retimers and
  Smart Redrivers, the Leo CXL Smart Memory Controllers, and the Scorpio Smart Fabric
  Switches, all managed by COSMOS (COnnectivity System Management and Optimization
  Software). COSMOS is the software layer of the platform: firmware modules on the
  devices plus platform-level libraries that run on hosts and baseboard management
  controllers, exposing what Astera Labs describes as a single standardized API for
  device discovery, configuration, security attestation, firmware update, telemetry,
  link diagnostics, RAS testing, scripting and fleet management. That API surface is
  an on-premises host/BMC SDK rather than a public web API: the COSMOS Developer Kit
  is offered through a "Contact Us" motion and the supporting application notes are
  released through a document-request form, so no public API reference or
  machine-readable specification is published.'
